# Pinned toolchain manifest for inv-30.
# All packages installed at image build time; no runtime install permitted.
base:
  image: debian:bookworm-slim
  digest: sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818

apt_debian_bookworm:
  - bash
  - coreutils
  - curl
  - jq
  - python3
  - python3-flask
  - python3-psycopg2
  - python3-hvac
  - python3-yaml
  - nginx=1.24.*
  - supervisor
  - procps
  - iproute2
  - diffutils
  - gawk
  - sed
  - grep
  - patch
  - unzip
  - libcap2-bin

apt_postgresql_org:
  - postgresql-16=16.4-*
  - postgresql-client-16=16.4-*

github_release:
  - name: hashicorp_vault
    version: 1.15.6
    arch: linux_amd64
    url_template: https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip
