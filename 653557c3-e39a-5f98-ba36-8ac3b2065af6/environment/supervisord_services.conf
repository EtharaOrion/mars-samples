[unix_http_server]
file=/var/run/supervisor.sock
chmod=0770
chown=root:agent

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:vault]
command=/usr/local/bin/vault server -config=/etc/vault/config.hcl
user=vault
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/vault/server.log
stderr_logfile=/var/log/vault/server.log

[program:vault_post_start]
command=/opt/vault_post_start.sh
user=root
autostart=true
autorestart=false
startsecs=0
priority=15
startretries=3
environment=HOME="/var/lib/vault"
stdout_logfile=/var/log/vault/post_start.log
stderr_logfile=/var/log/vault/post_start.log

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/postgresql/postgres.log
stderr_logfile=/var/log/postgresql/postgres.log

[program:webapp]
command=/usr/bin/python3 /opt/webapp/app.py
user=webapp
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/webapp/webapp.log
stderr_logfile=/var/log/webapp/webapp.log

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
priority=40
stdout_logfile=/var/log/nginx/nginx.log
stderr_logfile=/var/log/nginx/nginx.log
