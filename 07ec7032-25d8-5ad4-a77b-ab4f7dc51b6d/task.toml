schema_version = "1.1"

[task]
name = "mars/pipe-log-triage-heterogeneous-formats-v2"
description = "Aggregate 5xx events across three log shards spanning three different wire formats (apache combined UTC, nginx JSON UTC, RFC5424 syslog Asia/Kolkata +05:30). One shard's timestamps are non-UTC and must be converted; one shard embeds the literal string status=500 inside a comment inside a structured field as noise. The verifier runs four bound invocations (public/holdout shards times full/tight windows) whose four distinct expected counts defeat any hardcoded-integer shortcut."
authors = [{ name = "mars-forge" }]
keywords = ["log-triage", "cli-shell-pipeline", "compositional-multi-domain-reasoning", "timezone-conversion", "structured-field-noise", "half-open-utc-window"]

[metadata]
mars_sub_type = "cli"
mars_archetype = "cli-shell-pipeline"
mars_maturity = "draft"
mars_tier = "frontier-defeat"
mars_disposition_ceiling = "HOLD:PILOT_REQUIRED"
mars_forge_contract_sha256 = "7fa61afd155a88f234f6c741a34546782fa0f53ca44afd5ead5a71094a7e5655"
mars_forge_invocation = "35"
mars_primary_hardness_lever = "compositional-multi-domain-reasoning"
mars_legacy_predecessor_uuid = "3e9c8bd7-f6a4-57b0-9158-5ee4f7e560c3"
mars_task_uuid = "07ec7032-25d8-5ad4-a77b-ab4f7dc51b6d"

[verifier]
timeout_sec = 180.0

[agent]
timeout_sec = 1200.0

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 2048
storage_mb = 4096
gpus = 0
network_mode = "public"

[verifier.env]
[environment.env]
[solution.env]

[[artifacts]]
source = "/workspace/shards/shard_a.log"

[[artifacts]]
source = "/workspace/shards/shard_b.log"

[[artifacts]]
source = "/workspace/shards/shard_c.log"

[[artifacts]]
source = "/workspace/solve.sh"

[prosecutor]
mode = "harness_provided"
delegate = "harness/mars_council.py"
in_container_stub = "tests/run_prosecutor_judge.py"
note = "3-judge Claude council runs on host post-container; in-container stub is a no-op marker for G-VER-INVARIANCE"
