[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:elasticsearch]
command=/usr/share/elasticsearch/bin/elasticsearch
directory=/usr/share/elasticsearch
user=elasticsearch
environment=ES_JAVA_OPTS="-Xms512m -Xmx512m",ES_PATH_CONF="/etc/elasticsearch"
autostart=true
autorestart=true
startsecs=15
startretries=5
stopsignal=TERM
stopwaitsecs=45
stdout_logfile=/var/log/supervisor/elasticsearch.stdout.log
stderr_logfile=/var/log/supervisor/elasticsearch.stderr.log
stdout_logfile_maxbytes=1048576
stderr_logfile_maxbytes=1048576
priority=10
