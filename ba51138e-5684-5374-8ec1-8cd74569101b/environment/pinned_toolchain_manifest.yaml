toolchain_manifest:
  base_image:
    reference: "debian:bookworm-slim"
    digest: "sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818"
  binaries:
    - name: "bash"
      package: "bash"
      role: "shell interpreter for the pipeline"
    - name: "gawk"
      package: "gawk"
      role: "stateful stream aggregator over jstack stanzas"
    - name: "sort"
      package: "coreutils"
      role: "ascending lex sort over the 18-character HotSpot pointer strings"
    - name: "sed"
      package: "sed"
      role: "auxiliary substitution if needed"
    - name: "grep"
      package: "grep"
      role: "auxiliary pattern matching"
    - name: "python3"
      package: "python3"
      role: "wait-for graph construction and cycle detection on the agent side; regex/integer parsing on the verifier side"
    - name: "diffutils"
      package: "diffutils"
      role: "verifier-side byte-level diff"
    - name: "patch"
      package: "patch"
      role: "enumerated gnu-patch -p1 apply path over a scaffold solve.sh, reading a unified diff from stdin or a file"
  locale:
    LC_ALL: "C.UTF-8"
    LANG: "C.UTF-8"
    TZ: "UTC"
