    line_shape: "<row_type>\t<value>\n"
    trailing_newline_per_row: true
    row_types_closed_set: [DEADLOCKED_THREAD_COUNT, CONTENTION_THREAD_COUNT, DEADLOCK_LOCK, CONTENTION_LOCK]
  row_ordering_comparator_contract:
    row_1_prefix: DEADLOCKED_THREAD_COUNT
    row_2_prefix: CONTENTION_THREAD_COUNT
    row_3_to_k_block_prefix: DEADLOCK_LOCK
    row_k_plus_1_to_n_block_prefix: CONTENTION_LOCK
    within_lock_block: field_2_lock_address_ascending_byte_order_lex
    interleaving_allowed: false
    locale: "C"
  bound_shortcut_pattern_set:
    - 'FORGE_HOLDOUT_CANARY_[A-Z0-9]{32}'
    - 'solution/grounding\.yaml'
    - 'solution/TRUTH\.md'
    - 'dataset/[0-9a-f-]{36}/(solution|tests)/'
    - '/holdout/'
    - 'HARDCODED_REPORT_RECITAL_BEGIN'
    - 'HARDCODED_REPORT_RECITAL_END'
    - 'reference_row_set'
    - 'reference_deadlock_locks'
    - 'reference_contention_locks'
    - 'reference_deadlock_count'
    - 'reference_contention_count'
    - 'canonical_output_form'
    - 'per_field_schema_shape_regex_family'
    - '/tests/grader\.py'
    - 'EXPECTED_LINES'
    - 'from\s+grader\s+import'
    - "sys\\.path\\.insert\\s*\\([^)]*['\"]/?tests"
    - "sys\\.path\\.append\\s*\\([^)]*['\"]/?tests"
  solve_script_line_budget: 90
  reference_row_set:
