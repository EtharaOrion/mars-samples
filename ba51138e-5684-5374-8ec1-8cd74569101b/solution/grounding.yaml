    tools_on_path: [bash, gawk, sed, grep, sort, uniq, python3, diffutils]
    network_policy: "no-network"
    workspace_root: "/workspace"
    input_threaddump_path: "/workspace/input/threaddump.txt"
    output_path: "/workspace/out/report.tsv"
  output_file_shape_contract:
    path: "/workspace/out/report.tsv"
    field_separator: "0x09"
    field_count: 2
    non_empty: true
    utf8: true
    trailing_newline: true
  per_field_schema_shape_regex_family:
    field_1_row_type: '^(DEADLOCKED_THREAD_COUNT|CONTENTION_THREAD_COUNT|DEADLOCK_LOCK|CONTENTION_LOCK)$'
    field_2_count: '^(0|[1-9][0-9]*)$'
    field_2_lock_address: '^0x[0-9a-f]{16}$'
