toolchain_manifest:
  base_image:
    reference: "debian:bookworm-slim"
    digest: "sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818"
  binaries:
    - name: "bash"
      package: "bash"
      role: "shell interpreter for the four-stage pipeline"
    - name: "jq"
      package: "jq"
      role: "stage 1 severity filter and stage 2 TSV projection"
    - name: "gawk"
      package: "gawk"
      role: "stage 3 test-path drop over the TSV intermediate"
    - name: "sort"
      package: "coreutils"
      role: "stage 4 lex sort and byte-level dedupe"
    - name: "sed"
      package: "sed"
      role: "auxiliary substitution if needed"
    - name: "grep"
      package: "grep"
      role: "auxiliary pattern matching"
    - name: "python3"
      package: "python3"
      role: "grader interpreter"
    - name: "diffutils"
      package: "diffutils"
      role: "verifier-side set-equality diff"
    - name: "node"
      package: "nodejs"
      role: "typescript toolchain token; solutions using node to bypass the shell pipeline are rejected by D5 and D6"
  locale:
    LC_ALL: "C.UTF-8"
    LANG: "C.UTF-8"
