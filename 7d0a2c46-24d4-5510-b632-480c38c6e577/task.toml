schema_version = "1.1"

[task]
name = "mars/configure-cmake-rpath-drift-v2"
description = "Configure CMake rpath so the installed binary at prefix/bin/myapp loads libcore.so from prefix/lib and its runtime-dlopened plugin at prefix/share/myapp/plugins/libplugin.so loads libplugin_dep.so from prefix/share/myapp/libs. Requires deriving TWO distinct $ORIGIN-relative rpath expressions, one per target, and proving the entire prefix subtree is relocatable to any absolute path under an empty LD_LIBRARY_PATH."
authors = [{ name = "mars-forge" }]
keywords = ["cmake", "rpath", "origin", "dlopen", "shared-libraries", "build-configure", "compositional-multi-domain-reasoning", "relocatable-install"]

