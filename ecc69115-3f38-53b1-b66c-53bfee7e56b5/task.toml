schema_version = "1.1"
artifacts = []

[task]
name = "terminal-bench/bazel-monorepo-build"
description = "A Go monorepo built by a Bazel-style graph runner ships a dependency graph missing two required edges, so downstream targets fail to build; fix the BUILD files so all targets build in order and the binary and test target are correct."
keywords = ["build-graph", "monorepo", "dependency-order", "go", "bazel-style", "strict-deps"]

[[task.authors]]
name = "FORGE"
email = "forge@anubis.local"

[metadata]
author_name = "FORGE"
author_email = "forge@anubis.local"
difficulty = "medium"
category = "software-engineering"
sub_type = "build-ci-cd"
tags = ["build-ci-cd", "long-horizon-multi-target", "world-state"]
expert_time_estimate_min = 20
junior_time_estimate_min = 45

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[environment]
