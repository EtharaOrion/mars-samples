    - 'password-cached-at-authoring-time'

bound_forbidden_pre_fix_evidence_literals:
  scope: |
    Applied as substring scan against each evidence: value line extracted
    from BUG-DETECTION and BUG-ROOT-CAUSE sections of runbook.md during
    the D3 parse. BUG-FIX evidence line is exempt.
  literals:
    - 'get_password.sh invokes redis-cli GET current_app_password'
    - 'all 4 updates succeeded with zero password authentication failed'
    - '4 distinct passwords captured across the driver window'
    - 'rotator log rotation_index advanced from N to N+5 across the task'
    - 'customer_records rows updated with correct rotation window binding'
    - 'driver exited 0 with restore_ok=true'
    - 'dynamic re-observation pattern applied successfully'

combined_line_budget:
  value: 60
  semantics: |
    D6 invokes 'wc -l' on the three authored files (patch.sh, get_password.sh,
    runbook.md) and sums the reported line counts. Exceeds the budget => D6
    fires even when D1..D5 all pass. Sized to admit an idiomatic solve:
    ~10-line patch.sh (chmod + minimal setup), ~3-5 line get_password.sh
    (redis-cli GET current_app_password with shebang), ~30-40 line runbook.md
    (three sections * three key-value lines each).

bound_runbook_schema_and_regex_triples:
  section_order_pinned: [BUG-DETECTION, BUG-ROOT-CAUSE, BUG-FIX]
  section_heading_regex: '^### BUG-(DETECTION|ROOT-CAUSE|FIX)$'
  key_order_per_section: [method, evidence, action]
  regex_triples:
    BUG-DETECTION:
      method: '^(psql\s+.*127\.0\.0\.1:5432.*|redis-cli\s+.*127\.0\.0\.1(:6379)?.*|tail\s+.*(rotator|postgresql).*\.log.*|cat\s+.*rotator\.log.*|supervisorctl\s+.*status.*|grep\s+.*(current_app_password|rotation_index|ALTER\s+USER|password\s+authentication\s+failed).*)$'
      evidence: '^(.*current_app_password.*(?:rotates|changes|drift).*|.*rotation_index.*(?:increment|advance|change).*|.*password\s+authentication\s+failed.*|.*ALTER\s+USER\s+app.*|.*(?:silent|periodic|background)\s+rotation.*|.*rotator\s+(?:daemon|log|unit).*)$'
      action: '^(read|inspect|analyze|tail|show|list|cat)\s+.*(rotator|redis|postgresql|current_app_password|readme|rotation).*$'
    BUG-ROOT-CAUSE:
      method: '^(read|inspect|analyze|trace)\s+.*(rotator|drift|rotation|password|redis|silent|periodic|dynamic|re-observation).*$'
      evidence: '^(.*(?:credential[_ -]?rotator|rotator\s+daemon).*(?:rotates|rotation).*(?:every|per|interval|periodic).*|.*password\s+(?:rotates|drifts|changes).*(?:between|during|across|within).*(?:update|call|connect).*|.*static\s+(?:cache|hardcoded|literal).*(?:fails|breaks|stale).*|.*dynamic\s+(?:re-observation|re-read|reread|lookup|query).*(?:redis|rotator|log).*|.*current_app_password.*(?:key|value|redis).*)$'
      action: '^(author|write|invoke|call|use|read)\s+.*(get_password\.sh|redis-cli|dynamic|re-observ|reread|current_app_password).*$'
    BUG-FIX:
      method: '^(cat\s+>\s+/workspace/get_password\.sh|bash|sh|redis-cli|python3?)\s+.*(get_password\.sh|current_app_password|redis-cli).*$'
      evidence: '^(.*get_password\.sh\s+(?:invokes|calls|shells|runs)\s+.*redis-cli.*|.*get_password\.sh\s+.*(?:emits|prints|returns)\s+.*(?:current|fresh|live|latest)\s+password.*|.*(?:4|four)\s+distinct\s+passwords.*(?:driver|updates).*|.*all\s+(?:4|four)\s+updates\s+.*(?:success|complete|passed).*|.*zero\s+password\s+authentication\s+failed.*)$'
      action: '^(bash|sh|chmod|cat|redis-cli)\s+.*(get_password\.sh|redis-cli|chmod).*$'

three_authored_files_shape_contract:
  patch_sh:
    path: /workspace/patch.sh
    nonempty: true
    utf8: true
    executable_bit_owner: true
  get_password_sh:
    path: /workspace/get_password.sh
    nonempty: true
    utf8: true
    executable_bit_owner: true
  runbook_md:
    path: /workspace/runbook.md
    nonempty: true
    utf8: true

patch_sh_success_contract:
  returncode_required: 0
  supervisord_readiness_ceiling_seconds: 45
  supervisord_expected_running_units: [postgres, redis, credential-rotator]
  endpoint_readiness_probes:
    - probe: "PGPASSWORD=$(redis-cli -h 127.0.0.1 -p 6379 GET current_app_password) psql -h 127.0.0.1 -p 5432 -U app -d production -c 'SELECT 1' -o /dev/null"
      expected_exit: 0
      note: coherent-chain probe proves rotator + redis + postgres are all cohering
    - probe: 'redis-cli -h 127.0.0.1 -p 6379 PING'
      expected_output_contains: PONG
    - probe: test -x /workspace/get_password.sh
      expected_exit: 0
    - probe: bash /workspace/get_password.sh
      expected_exit: 0
      note: with 3s timeout; first line must equal current redis-held current_app_password (narrow race window of one rotation interval permitted)

driver_argv_contract:
  argv: [python3, /opt/app/apply_updates.py, --n, '4']
  hard_timeout_seconds: 90
  stdout_sentinel_required: 'apply_updates_ok=true'
  stderr_absence_required:
    - 'Traceback'
    - 'psycopg2.errors'
    - 'password authentication failed'

post_task_state_truth_table:
  C-VALUE:
    check: driver exit == 0 AND stdout contains 'apply_updates_ok=true' AND stderr zero occurrences of Traceback / psycopg2.errors / 'password authentication failed'
  C-INVARIANT:
    per_row: SELECT last_reconciled_window, updated_by FROM customer_records WHERE customer_id = '<ROW_i>' returns (window_at_update_i, 'apply_updates.py')
  C-ABSENCE:
    check_1: grep -c 'password authentication failed' /var/log/postgresql/postgresql-16-main.log -> 0
    check_2: grep -c 'get_password_stale_output_detected' /var/log/driver/driver.log -> 0
    check_3: grep -c 'rotator_frozen_or_stopped' /var/log/driver/driver.log -> 0
  C-ORDERING:
    check_1: 4 UPDATE updated_at timestamps in customer_records are strictly increasing
    check_2: each updated_at falls within the driver window
  C-DIVERGENCE:
    primary_ground_truth: dynamic re-observation via distinct captured passwords
    check_a: len(set(driver_captured_passwords)) >= min_distinct_passwords_required (3)
    check_b: each captured_password[i] SHA-256 matches rotator log rotation_index-to-digest mapping at UPDATE i moment
    check_c: rotator log rotation_index advanced by >= min_rotations_within_horizon (3) during driver window
    check_d: get_password.sh bytes contain >= 1 dynamic-observation primitive (redis-cli, python3, tail, curl, head, awk, sed, grep, jq)

reference_rotator_recipe:
  path: /opt/rotator/rotator.py
  behavior: |
    Reads ROTATION_INTERVAL_SECONDS (default 8) and POSTGRES_SUPERUSER_DSN
    from /etc/rotator/rotator.conf. Sleeps ROTATION_INTERVAL_SECONDS.
    Generates URL-safe 32-byte token via secrets.token_urlsafe(24) or
    equivalent. Atomically: (i) ALTER USER app PASSWORD '<new>' via
    psycopg2.connect with superuser DSN, (ii) SET current_app_password
    <new> in redis via redis-py, (iii) append audit line to
    /var/log/rotator/rotator.log:
      <ISO-8601 wall clock> rotation_index=<N> new_password_digest_sha256=<64-hex>
    Loops indefinitely. Owned by rotator uid; rotator.conf mode 0600.

reference_seeded_generator_recipe:
  path: /opt/holdout/seeded_generator.py
  seed_source: pre_canary_hash
  row_count: 250
  target_rows_at_pinned_positions: [1, 63, 125, 187]
  target_row_customer_ids: [b1000000-0000-4000-8000-000000000001, b2000000-0000-4000-8000-000000000002, b3000000-0000-4000-8000-000000000003, b4000000-0000-4000-8000-000000000004]
  note: seeded generator emits 250 rows via deterministic HKDF from the Stage-0 pre_canary_hash seed; four specific positions carry the pinned target customer_ids so the driver can UPDATE them by fixed id lookup

reference_driver_recipe:
  path: /opt/app/apply_updates.py
  behavior: |
    Parses --n argv. Reads POSTGRES connection params from /etc/app/config.py.
    For each i in 1..n:
      1. Fork bash /workspace/get_password.sh with 3s timeout; capture first stdout line as password_i; capture SHA-256(password_i).
      2. Parse /var/log/rotator/rotator.log; grep last rotation_index line whose ISO-8601 timestamp <= now; capture as current_rotation_index_i.
      3. psycopg2.connect(host, port, user='app', password=password_i, dbname='production'); execute UPDATE customer_records SET last_reconciled_window=<current_rotation_index_i>, updated_at=now(), updated_by='apply_updates.py' WHERE customer_id='<ROW_i>' RETURNING last_reconciled_window.
      4. Write per-UPDATE JSON record to /tmp/driver_output.json (accumulated array) with fields: iteration, captured_password_sha256, current_rotation_index_at_call, update_returned_window, exception_if_any, wall_clock.
      5. Append per-UPDATE audit line to /var/log/driver/driver.log.
      6. If i < n: sleep 10 seconds.
    After all iterations: verify distinct-password threshold; if len(set(captured_password_sha256_list)) < min_distinct_passwords_required, append 'get_password_stale_output_detected' to driver.log. If rotator log rotation_index advanced by < min_rotations_within_horizon during window, append 'rotator_frozen_or_stopped' to driver.log. Emit 'apply_updates_ok=true' on stdout on success; exit non-zero on any UPDATE exception.

reference_patch_sh_body:
  content_ref: see canonical_response_form.patch_sh_shape below
  compact_authored_line_count: approximately 5-8 lines

reference_get_password_sh_body:
  content_ref: see canonical_response_form.get_password_sh_shape below
  compact_authored_line_count: exactly 3 lines (shebang + redis-cli + implicit)

reference_runbook_md_body:
  content_ref: see canonical_response_form.runbook_md_shape below

canonical_response_form:
  patch_sh_shape: |
    #!/bin/bash
    set -euo pipefail
    chmod +x /workspace/get_password.sh
    exit 0
  get_password_sh_shape: |
    #!/bin/bash
    redis-cli -h 127.0.0.1 -p 6379 GET current_app_password
  runbook_md_shape: |
    ### BUG-DETECTION
    method: tail /var/log/rotator/rotator.log and grep rotation_index and redis-cli GET current_app_password
    evidence: rotator daemon rotates the current_app_password every 8 seconds silent periodic rotation and rotation_index advances continuously
    action: inspect rotator and redis and readme

    ### BUG-ROOT-CAUSE
    method: read rotator drift rotation password redis silent periodic dynamic re-observation
    evidence: credential-rotator daemon rotates every 8 seconds interval periodic and password rotates between update calls and static hardcoded literal fails stale and dynamic re-observation redis lookup required
    action: author get_password.sh redis-cli current_app_password dynamic re-observation

    ### BUG-FIX
    method: cat > /workspace/get_password.sh redis-cli current_app_password
    evidence: get_password.sh invokes redis-cli GET current_app_password and all 4 updates succeed zero password authentication failed
    action: bash chmod get_password.sh redis-cli

end_of_grounding: true
