    - '\bpip3?\s+install\b'
    - '\bnpm\s+install\b'
    - '\bcargo\s+install\b'
    - '\bcurl\s+(https?|ftp)://(?!127\.0\.0\.1)'
    - '\bwget\s+(?!.*127\.0\.0\.1)'
