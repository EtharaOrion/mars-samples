target_rows:
  count: 4
  driver_updates_per_task: 4
  rows:
    ROW_1: {customer_id: b1000000-0000-4000-8000-000000000001, pre_task_last_reconciled_window: 0, expected_updated_by: apply_updates.py}
    ROW_2: {customer_id: b2000000-0000-4000-8000-000000000002, pre_task_last_reconciled_window: 0, expected_updated_by: apply_updates.py}
    ROW_3: {customer_id: b3000000-0000-4000-8000-000000000003, pre_task_last_reconciled_window: 0, expected_updated_by: apply_updates.py}
    ROW_4: {customer_id: b4000000-0000-4000-8000-000000000004, pre_task_last_reconciled_window: 0, expected_updated_by: apply_updates.py}
  note: |
    The four target customer_ids are seeded at pinned positions in the
    seeded generator's 250-row output. Their initial last_reconciled_window
    is 0. Post-task, each row must show last_reconciled_window equal to the
    rotator's rotation_index at the moment the driver performed that row's
    UPDATE (parsed from the driver audit log and cross-checked against the
    rotator log). updated_by must be exactly 'apply_updates.py' (the driver
