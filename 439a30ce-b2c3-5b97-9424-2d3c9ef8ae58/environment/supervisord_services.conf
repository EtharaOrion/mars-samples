[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/postgresql/postgres-stdout.log
stderr_logfile=/var/log/postgresql/postgres-stderr.log
stopsignal=INT

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
user=redis
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/redis/redis-stdout.log
stderr_logfile=/var/log/redis/redis-stderr.log

[program:credential-rotator]
command=/usr/bin/python3 /opt/rotator/rotator.py
user=rotator
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/rotator/rotator-stdout.log
stderr_logfile=/var/log/rotator/rotator-stderr.log
environment=PYTHONUNBUFFERED="1"
