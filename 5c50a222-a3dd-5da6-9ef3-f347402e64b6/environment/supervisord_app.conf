[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:app]
command=/usr/bin/python3 /app/main.py
directory=/app
autostart=true
autorestart=true
startsecs=2
startretries=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/app.stdout.log
stderr_logfile=/var/log/supervisor/app.stderr.log
stdout_logfile_maxbytes=1048576
stderr_logfile_maxbytes=1048576
priority=10

[program:prometheus]
command=/usr/bin/prometheus
  --config.file=/etc/prometheus/prometheus.yml
  --storage.tsdb.path=/var/lib/prometheus
  --storage.tsdb.retention.time=1h
  --web.listen-address=127.0.0.1:9090
  --no-web.enable-lifecycle
  --web.max-connections=32
  --log.level=info
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/prometheus.stdout.log
stderr_logfile=/var/log/supervisor/prometheus.stderr.log
stdout_logfile_maxbytes=1048576
stderr_logfile_maxbytes=1048576
priority=20
