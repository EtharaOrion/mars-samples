description = "Repair a half-configured pnpm workspace so a clean recursive build links the local packages in the right order and the cli prints the correct report."
keywords = ["pnpm", "workspace", "monorepo", "build", "ci"]

[[task.authors]]
name = "FORGE"
email = "forge@anubis.local"

