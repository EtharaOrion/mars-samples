schema_version = "1.1"
artifacts = []

[task]
name = "terminal-bench/fix-gradle-build"
description = "A multi-module Gradle build is misconfigured (a subproject is not registered and the jar targets a deprecated entrypoint) so a clean offline build yields a wrong-but-green application; fix the Gradle config so the offline build runs the real entrypoint and passes its tests."
keywords = ["gradle", "java", "build", "multi-module", "offline", "settings-gradle"]

[[task.authors]]
name = "FORGE"
email = "forge@anubis.local"

