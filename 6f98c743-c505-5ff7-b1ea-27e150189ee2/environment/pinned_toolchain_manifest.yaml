toolchain_manifest:
  base_image:
    reference: "debian:bookworm-slim"
    digest: "sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818"
  binaries:
    - name: "bash"
      package: "bash"
      role: "shell interpreter for the pipeline"
    - name: "jq"
      package: "jq"
      role: "stage-1 severity+date filter over audit.jsonl and structural TSV projection"
    - name: "python3"
      package: "python3"
      role: "stage-2 tomllib workspace-member manifest parser and stage-3 direct/transitive classifier over the resolution graph; also drives the verifier-side regex/set-equality/integer-parsing checks"
    - name: "sort"
      package: "coreutils"
      role: "stage-4 stable sort with hidden numeric severity_rank primary key and lex secondary/tertiary keys"
    - name: "gawk"
      package: "gawk"
      role: "stage-4 rank-prefix stripping and structural row emit"
    - name: "sed"
      package: "sed"
      role: "auxiliary substitution if needed"
    - name: "grep"
      package: "grep"
      role: "auxiliary pattern matching"
    - name: "diffutils"
      package: "diffutils"
      role: "verifier-side byte-level diff"
    - name: "patch"
      package: "patch"
      role: "enumerated gnu-patch -p1 apply path over a scaffold solve.sh, reading a unified diff from stdin or a file"
  locale:
    LC_ALL: "C.UTF-8"
    LANG: "C.UTF-8"
    TZ: "UTC"
