schema_version = "1.1"
artifacts = []

[task]
name = "terminal-bench/rootless-podman-uid-mapping"
description = "Repair a half-set rootless Podman configuration (subuid/subgid ranges, storage driver, and user-namespace run spec) so an unprivileged user's container maps to uid 1000 and can access an owner-only bind-mounted file."
keywords = ["podman", "rootless", "userns", "uid-mapping", "subuid", "container-setup"]

[[task.authors]]
name = "FORGE"
email = "forge@anubis.local"

[metadata]
author_name = "FORGE"
author_email = "forge@anubis.local"
difficulty = "hard"
category = "other"
sub_type = "container-setup"
tags = ["container-setup", "ambiguous-intermediate-state", "world-state"]
expert_time_estimate_min = 30
junior_time_estimate_min = 60

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
docker_image = "anubis/rootless-podman-uid-mapping:1.0"
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[verifier.env]

[environment.env]

[solution.env]
