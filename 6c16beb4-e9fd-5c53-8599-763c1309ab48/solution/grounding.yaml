forge_canary_b: 67d0f11cb77d801081a8ff8a463742f4

unified_tls_backend_target: ring
alternative_valid_unified_target: aws-lc-rs

authored_manifest_of_broken_state:
  workspace_member_webhook_sender_rustls_features:
  - std
  - tls12
  - ring
  workspace_member_api_gateway_rustls_features:
  - std
  - tls12
  - aws-lc-rs
  cargo_feature_unification_produces_rustls_with_features:
  - std
  - tls12
  - ring
  - aws-lc-rs
  runtime_panic_root_cause: |
    rustls 0.23 process_default_provider() panics when both ring and
    aws-lc-rs crypto provider features are compiled in and no
    process-level default provider has been explicitly installed via
    CryptoProvider::install_default().

observed_panic_message: |
  thread 'main' panicked at ... rustls-0.23.../src/crypto/mod.rs:...:
  Could not automatically determine the process-level CryptoProvider
  from rustls crate features. Call CryptoProvider::install_default()
  before this point to select a provider manually, or make sure exactly
  one provider is enabled via crate features.

false_lead_probe_a: agent_swallows_the_panic_via_result_ignore_pattern
false_lead_expected_outcome_a: cold_start_rebuild_still_produces_panic_at_runtime
false_lead_probe_b: agent_switches_to_http_not_https_to_avoid_tls_entirely
false_lead_expected_outcome_b: mock_server_is_https_only_on_8443_so_http_get_fails
false_lead_probe_c: agent_removes_api_gateway_from_workspace_members
false_lead_expected_outcome_c: target_binary_no_longer_compiles_because_it_imports_api_gateway

