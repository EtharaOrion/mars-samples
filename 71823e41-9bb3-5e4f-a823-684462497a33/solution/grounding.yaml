canary_a: FORGE_HOLDOUT_CANARY_6F93E7403352DD3AB788C4BB73B4C9BB
canary_b: FORGE_HOLDOUT_CANARY_A90797C4DBFE1038D9BCEF0C9887CB1F

# Canary tokens above are derived at Stage-0 authoring time by the
# same KDF as inv-26. solution/recompute.py replays the derivation
# from the frozen bundle bytes and validates the fixed point:
#   pre_canary_hash = canonical SHA-256 over sorted (relpath, content)
#     length-prefixed frames, with every FORGE_HOLDOUT_CANARY_[A-Z0-9]{32}
#     match replaced by the fixed placeholder FORGE_HOLDOUT_CANARY_XXXX...
#   canary_a = "FORGE_HOLDOUT_CANARY_" +
#     HMAC-SHA256(pre_canary_hash_utf8, b"canary-a-v1").hexdigest()
#       .upper()[:32]
#   canary_b = "FORGE_HOLDOUT_CANARY_" +
#     HMAC-SHA256(pre_canary_hash_utf8, b"canary-b-v1").hexdigest()
#       .upper()[:32]
# The pre-canary hash is invariant across canary planting states
# because CANARY_RE strips every matching token before hashing. The
# fixed point holds because substituting the strip placeholder with
# the KDF output does not change the canary-stripped bytes.

task_slug: pg-pgbouncer-redis-multi-service-cache-stampede-and-pool-mode-drift
invocation: 27
harbor_schema_version: '1.4'
domain: container-setup-tasks
archetype: container-multi-service
primary_lever: compositional-multi-domain-reasoning
task_lever_label: pg-pgbouncer-redis-cache-stampede-and-pool-mode-drift

combined_line_budget: 220
combined_line_budget_semantics: |
  Sum of newline-terminated lines across /workspace/patch.sh and
  /workspace/runbook.md, compared with '<=' semantics so a solve
  whose combined count equals the budget passes. Sized to admit an
  idiomatic three-domain remediation (sed -i edit of
  /etc/pgbouncer/pgbouncer.ini to set pool_mode=session and raise
  max_client_conn above 50, sed -i edit of /etc/app/config.py to
  raise CACHE_LOCK_TTL_SECONDS above the fill-duration ceiling,
  supervisorctl restart pgbouncer, bounded readiness poll on the
  three service endpoints, optional post-remediation worker
  validation trigger), plus a three-section runbook with three
  key-value lines each. The budget rejects a heredoc-based
  hardcoded recital of the pre-fix log stream and rejects a
  verbatim paste of the reference honey-trap files as the runbook
  body. Twenty-line reduction vs inv-26 reflects the fact that
  three sed-based config edits are structurally shorter than five
  curl-based REST remediations even though the reasoning surface
  is strictly harder.

