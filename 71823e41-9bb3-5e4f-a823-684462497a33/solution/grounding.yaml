  - {name: requests, primary_key: request_id, rows_at_container_start: 0, rows_post_replay: 1000}
  - {name: catalog,  primary_key: catalog_id, rows_at_container_start: 5000, rows_post_replay: 5000}
  - {name: audit,    primary_key: audit_id,   rows_at_container_start: 0, rows_post_replay: 1000}

