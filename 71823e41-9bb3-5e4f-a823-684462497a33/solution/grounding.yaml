  stdout_sentinel: 'replay_ok=true'
  stderr_zero_substrings: ['Traceback', 'psycopg2.errors']
  connects_to_pgbouncer_at: 127.0.0.1:6432
  connects_to_redis_at: 127.0.0.1:6379
  never_connects_directly_to_postgres_at: 127.0.0.1:5432

control_expected_check_class_overrides:
  C19:
    control_id_substring_match: C19_kill_supervisord
    old_expected_check_class: D4
    new_expected_check_class: D2
    reason: |
      C19_kill_supervisord_entirely: original expected D4 was authored on the assumption that supervisord kill would let three services appear RUNNING then fail at D4 grading. Observed behavior when supervisord (container PID 1) is killed: container terminates immediately; supervisorctl status becomes unreachable within D2's 45-second readiness window, so D2 fires first with all three services not RUNNING. D2 is the semantically correct expected class for this negative control. Class tightening from D4 -> D2 reflects the actual (and correct) grader behavior.
