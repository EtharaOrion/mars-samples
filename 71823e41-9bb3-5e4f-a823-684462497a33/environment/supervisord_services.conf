[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
startsecs=10
startretries=5
stopsignal=INT
stopwaitsecs=45
stdout_logfile=/var/log/supervisor/postgres.stdout.log
stderr_logfile=/var/log/supervisor/postgres.stderr.log
stdout_logfile_maxbytes=1048576
stderr_logfile_maxbytes=1048576
priority=10

[program:pgbouncer]
command=/usr/sbin/pgbouncer /etc/pgbouncer/pgbouncer.ini
user=pgbouncer
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/var/log/supervisor/pgbouncer.stdout.log
stderr_logfile=/var/log/supervisor/pgbouncer.stderr.log
stdout_logfile_maxbytes=1048576
stderr_logfile_maxbytes=1048576
priority=20

[program:redis]
command=/usr/bin/redis-server /etc/redis/redis.conf
user=redis
autostart=true
autorestart=true
startsecs=3
startretries=5
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/redis.stdout.log
stderr_logfile=/var/log/supervisor/redis.stderr.log
stdout_logfile_maxbytes=1048576
stderr_logfile_maxbytes=1048576
priority=15
