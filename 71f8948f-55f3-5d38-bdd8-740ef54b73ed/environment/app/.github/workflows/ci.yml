name: ci
on: [push]

env:
  BUILD_MODE: release

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "2.3.1"
    steps:
      - name: unit-and-artifact-tests
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: compile-report
        working-directory: calc
        run: make build
