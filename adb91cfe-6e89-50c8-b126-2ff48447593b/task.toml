schema_version = "1.1"

[task]
name = "mars/configure-makefile-phony-implicit-rule-conflict-v2"
description = "Fix a two-level recursive Make project so that make test and make build are both idempotent across two back-to-back invocations. The root Makefile has a .PHONY gap and recursively invokes $(MAKE) -C subdir, and the subdir Makefile has its own distinct .PHONY gap that only surfaces once a target-named file appears in the subdir workspace after the first invocation. The verifier runs make test and make build twice each and asserts all four invocations exit zero with the expected root+subdir marker lines on stdout."
authors = [{ name = "mars-forge" }]
keywords = ["make", "phony", "recursive-make", "build-configure", "long-horizon-agentic-coherence", "idempotence"]

