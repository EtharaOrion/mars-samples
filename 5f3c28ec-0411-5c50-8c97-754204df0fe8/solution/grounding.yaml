canary_header:
  canary_a: FORGE_HOLDOUT_CANARY_BE14E39A46C25C956E5156249BF52C83
  canary_b: FORGE_HOLDOUT_CANARY_ABEE62929481205361D04F1ADF518B32
  planted_here: solution/grounding.yaml is one of the four LGC1 canary planting sites; both canary_a and canary_b appear in every planting site (solution/solve.sh, solution/TRUTH.md, solution/grounding.yaml, solution/recompute.py).
  kdf_specification: |
    canary_a = "FORGE_HOLDOUT_CANARY_" +
      HMAC-SHA256(pre_canary_hash_utf8, b"canary-a-v1").hexdigest().upper()[:32]
    canary_b = "FORGE_HOLDOUT_CANARY_" +
      HMAC-SHA256(pre_canary_hash_utf8, b"canary-b-v1").hexdigest().upper()[:32]
    Fixed-point property: pre_canary_hash is invariant across canary
    planting states because CANARY_RE = FORGE_HOLDOUT_CANARY_[A-Z0-9]{32}
    strips every matching token before hashing. Substituting the strip
    placeholder with the KDF output does not change the canary-stripped
    bytes, so re-running solution/recompute.py from any planting state
    yields the same pre_canary_hash and the same derived canaries.

