[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/postgresql/postgres-stdout.log
stderr_logfile=/var/log/postgresql/postgres-stderr.log
stopsignal=INT

[program:approval-gate]
command=/usr/bin/python3 -m uvicorn app:app --host 127.0.0.1 --port 8080
directory=/opt/approval_gate
user=appgate
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/approval_gate/service.log
stderr_logfile=/var/log/approval_gate/service.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/nginx/supervisor-stdout.log
stderr_logfile=/var/log/nginx/supervisor-stderr.log
