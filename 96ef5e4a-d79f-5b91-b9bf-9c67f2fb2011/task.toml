schema_version = "1.1"

[task]
name = "mars/configure-gradle-toolchain-jdk21-test-jdk17-kotlin-dsl"
description = "Edit /workspace/build.gradle.kts (Kotlin DSL only, no Groovy DSL fallback) so that the build toolchain stays pinned to JDK 21 while main-class bytecode targets JDK 17 (major version 61). Both JDK 21 and JDK 17 are pre-installed on the container; Gradle 8.5 is pinned at /usr/local/bin/gradle. The verifier greps build.gradle.kts for the Kotlin toolchain block plus a JDK-21 languageVersion pin, rejects any Groovy syntax residue (bare-integer sourceCompatibility/targetCompatibility, space-call jvmToolchain, single-quoted deps, Groovy named-arg apply plugin:), rejects a Groovy build.gradle or settings.gradle fallback on presence, then runs gradle build, javap -v on the compiled main class (must report major version 61), and gradle test."
authors = [{ name = "mars-forge" }]
keywords = ["gradle", "kotlin-dsl", "toolchain", "build-configure", "compositional-multi-domain-reasoning", "jdk21", "jdk17-target"]

