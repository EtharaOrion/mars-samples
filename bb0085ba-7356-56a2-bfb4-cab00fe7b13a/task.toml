schema_version = "1.1"

[task]
name = "mars/cli-yq-preserve-anchor-alias-in-update-v2"
description = "Update two scalars in a YAML file with mikefarah yq while preserving BOTH the mapping anchor (which yq preserves natively) and the sequence-element anchor (which mikefarah yq silently drops on write). The agent must observe the naive-attempt symptom, diagnose the sequence-anchor loss, and apply a workaround (post-yq awk/sed re-injection of the dropped anchor label, or reserialization via python3 + ruamel.yaml). The verifier grades structural anchor/alias literal counts, yq-eval value readbacks, and alias-following readbacks that prove both anchors still resolve to updated content, on both the public config and a private holdout with distinct anchor names, paths, and values."
authors = [{ name = "mars-forge" }]
keywords = ["yq", "yaml", "mikefarah", "anchor-alias", "sequence-element-anchor", "cli-shell-pipeline", "verifier-hardness", "silent-bug-workaround"]

