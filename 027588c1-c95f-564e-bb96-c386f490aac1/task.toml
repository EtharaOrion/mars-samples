schema_version = "1.4"

[task]
name = "mars/configure-vite-dual-esm-cjs-exports-v3"
description = "Configure a TypeScript library that must publish as a dual ESM+CJS package where the ESM entry uses top-level await. The naive attempts (tsup --format cjs,esm, tsc --module commonjs, rollup without a shim) all break because top-level await cannot be lowered to synchronous CJS. The agent must keep the ESM source unchanged, declare an exports map with import and require conditions, and shape the CJS entry as a dynamic-import shim so it resolves to a thenable whose fulfilled value carries the named exports."
authors = [{ name = "mars-forge" }]
keywords = ["typescript", "esm", "cjs", "top-level-await", "dual-package", "exports-map", "dynamic-import", "build-configure"]

