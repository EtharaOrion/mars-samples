schema_version = "1.1"
artifacts = []

[task]
name = "terminal-bench/multistage-build-optimize"
description = "Convert a bloated single-stage Go Dockerfile into a minimal multi-stage build that stays under a size threshold while still shipping the runtime data file the service needs."
keywords = ["docker", "multi-stage", "golang", "image-size", "container-setup"]

[[task.authors]]
name = "FORGE"
email = "forge@anubis.local"

[metadata]
author_name = "FORGE"
author_email = "forge@anubis.local"
difficulty = "medium"
category = "other"
sub_type = "container-setup"
tags = ["container-setup", "silent-execution-failure", "world-state"]
expert_time_estimate_min = 20
junior_time_estimate_min = 45

[verifier]
timeout_sec = 900.0

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
docker_image = "anubis/multistage-build-optimize:1.0"
cpus = 1
memory_mb = 2048
