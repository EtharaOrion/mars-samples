schema_version = "1.4"

[task]
name = "mars/fix-go-mod-replace-vendor-desync-v2"
description = "Fix a Go module build that fails because the root `go.mod` replace target's local `go.mod` declares a mismatched module path. Naive agents run `go mod vendor` and `go mod tidy` repeatedly; the fix requires editing the local target's module declaration to match the replace directive."
authors = [{ name = "mars-forge" }]
keywords = ["go", "gomod", "replace-directive", "local-module", "build-fix", "long-horizon-agentic-coherence"]

