schema_version = "1.1"

[task]
name = "mars/ci-gitlab-cache-key-cross-branch-stale-v2"
description = "Fix /workspace/.gitlab-ci.yml so the two-job pipeline (populate + verify) does not pull a stale prior-week cache tarball off the runner cache root and its freshness probe exits zero. The runner exposes both CI_COMMIT_REF_SLUG and CI_ISO_WEEK to every job. The current cache stanza keys on CI_COMMIT_REF_SLUG alone so a stale /cache/main.tar.gz seeded during a prior ISO week matches the current-week pipeline and its stale week_marker.txt bytes fail scripts/freshness_probe.sh. The fix must compose both branch and ISO-week variables into the cache key without baking either as a literal, must leave scripts/freshness_probe.sh bytes intact, and must still declare a cache stanza."
authors = [{ name = "mars-forge" }]
keywords = ["gitlab-ci", "cache", "ci-pipeline", "compositional-multi-domain-reasoning", "cache-freshness", "iso-week"]

